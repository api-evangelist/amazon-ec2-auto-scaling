    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      x-aws-operation-name: DescribeAccountLimits
      operationId: GET_DescribeAccountLimits
      description: <p>Describes the current Amazon EC2 Auto Scaling resource quotas for your account.</p> <p>When you establish an Amazon Web Services account, the account has initial quotas on the maximum number of Auto Scaling groups and launch configurations that you can create in a given Region. For more information, see <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-quotas.html">Quotas for Amazon EC2 Auto Scaling</a> in the <i>Amazon EC2 Auto Scaling User Guide</i>.</p>
      responses:
        '200':
          description: Success
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/DescribeAccountLimitsAnswer'
              examples:
                GET_DescribeAccountLimits200Example:
                  summary: Default GET_DescribeAccountLimits 200 response
                  x-microcks-default: true
                  value:
                    MaxNumberOfAutoScalingGroups: example-string
                    MaxNumberOfLaunchConfigurations: example-string
                    NumberOfAutoScalingGroups: example-string
        '480':
          description: ResourceContentionFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ResourceContentionFault'
              examples:
                GET_DescribeAccountLimits480Example:
                  summary: Default GET_DescribeAccountLimits 480 response
                  x-microcks-default: true
                  value: {}
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - DescribeAccountLimits
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - 2011-01-01
      summary: Amazon EC2 Auto Scaling GET_ Describe Account Limits
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=DescribeAccountLimits'
    post:
      x-aws-operation-name: DescribeAccountLimits
      operationId: POST_DescribeAccountLimits
      description: <p>Describes the current Amazon EC2 Auto Scaling resource quotas for your account.</p> <p>When you establish an Amazon Web Services account, the account has initial quotas on the maximum number of Auto Scaling groups and launch configurations that you can create in a given Region. For more information, see <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-quotas.html">Quotas for Amazon EC2 Auto Scaling</a> in the <i>Amazon EC2 Auto Scaling User Guide</i>.</p>
      responses:
        '200':
          description: Success
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/DescribeAccountLimitsAnswer'
              examples:
                POST_DescribeAccountLimits200Example:
                  summary: Default POST_DescribeAccountLimits 200 response
                  x-microcks-default: true
                  value:
                    MaxNumberOfAutoScalingGroups: example-string
                    MaxNumberOfLaunchConfigurations: example-string
                    NumberOfAutoScalingGroups: example-string
        '480':
          description: ResourceContentionFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ResourceContentionFault'
              examples:
                POST_DescribeAccountLimits480Example:
                  summary: Default POST_DescribeAccountLimits 480 response
                  x-microcks-default: true
                  value: {}
      parameters:
      - name: Action
        in: query
