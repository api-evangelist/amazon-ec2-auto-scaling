        description: The maximum number of items to return with this call. The default value is <code>100</code> and the maximum value is <code>100</code>.
        schema:
          type: integer
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - DescribeLoadBalancers
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
