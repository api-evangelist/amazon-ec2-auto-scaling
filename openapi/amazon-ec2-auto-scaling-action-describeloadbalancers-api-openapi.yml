                  summary: Default POST_DescribeLoadBalancers 481 response
                  x-microcks-default: true
                  value: {}
      requestBody:
        content:
          text/xml:
            schema:
              $ref: '#/components/schemas/DescribeLoadBalancersRequest'
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - DescribeLoadBalancers
      - name: Version
        in: query
        required: true
