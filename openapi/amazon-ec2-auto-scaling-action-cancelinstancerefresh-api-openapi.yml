                  summary: Default POST_CancelInstanceRefresh 200 response
                  x-microcks-default: true
                  value:
                    InstanceRefreshId: example-id-1234
        '480':
          description: LimitExceededFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/LimitExceededFault'
              examples:
