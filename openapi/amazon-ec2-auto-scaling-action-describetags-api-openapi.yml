            text/xml:
              schema:
                $ref: '#/components/schemas/InvalidNextToken'
              examples:
                GET_DescribeTags480Example:
                  summary: Default GET_DescribeTags 480 response
                  x-microcks-default: true
                  value: {}
        '481':
