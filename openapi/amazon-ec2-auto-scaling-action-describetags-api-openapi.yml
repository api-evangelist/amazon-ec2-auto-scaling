              examples:
                GET_DescribeTags481Example:
                  summary: Default GET_DescribeTags 481 response
                  x-microcks-default: true
                  value: {}
      parameters:
      - name: Filters
        in: query
        required: false
        description: One or more filters to scope the tags to return. The maximum number of filters per filter type (for example, <code>auto-scaling-group</code>) is 1000.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
      - name: NextToken
