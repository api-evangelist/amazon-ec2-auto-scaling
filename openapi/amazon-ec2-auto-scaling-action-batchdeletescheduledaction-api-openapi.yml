    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      x-aws-operation-name: BatchDeleteScheduledAction
      operationId: GET_BatchDeleteScheduledAction
      description: Deletes one or more scheduled actions for the specified Auto Scaling group.
      responses:
        '200':
          description: Success
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/BatchDeleteScheduledActionAnswer'
              examples:
                GET_BatchDeleteScheduledAction200Example:
                  summary: Default GET_BatchDeleteScheduledAction 200 response
                  x-microcks-default: true
                  value:
                    FailedScheduledActions: example-string
        '480':
          description: ResourceContentionFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ResourceContentionFault'
              examples:
                GET_BatchDeleteScheduledAction480Example:
                  summary: Default GET_BatchDeleteScheduledAction 480 response
                  x-microcks-default: true
                  value: {}
      parameters:
      - name: AutoScalingGroupName
        in: query
        required: true
        description: The name of the Auto Scaling group.
        schema:
          type: string
          minLength: 1
          maxLength: 255
          x-pattern: '[\u0020-\uD7FF\uE000-\uFFFD\uD800\uDC00-\uDBFF\uDFFF\r\n\t]*'
      - name: ScheduledActionNames
        in: query
        required: true
        description: 'The names of the scheduled actions to delete. The maximum number allowed is 50. '
        schema:
          type: array
          items:
            $ref: '#/components/schemas/XmlStringMaxLen255'
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - BatchDeleteScheduledAction
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - 2011-01-01
      summary: Amazon EC2 Auto Scaling GET_ Batch Delete Scheduled Action
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=BatchDeleteScheduledAction'
    post:
      x-aws-operation-name: BatchDeleteScheduledAction
      operationId: POST_BatchDeleteScheduledAction
      description: Deletes one or more scheduled actions for the specified Auto Scaling group.
      responses:
        '200':
          description: Success
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/BatchDeleteScheduledActionAnswer'
              examples:
                POST_BatchDeleteScheduledAction200Example:
                  summary: Default POST_BatchDeleteScheduledAction 200 response
                  x-microcks-default: true
                  value:
                    FailedScheduledActions: example-string
        '480':
          description: ResourceContentionFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ResourceContentionFault'
              examples:
                POST_BatchDeleteScheduledAction480Example:
                  summary: Default POST_BatchDeleteScheduledAction 480 response
                  x-microcks-default: true
                  value: {}
      requestBody:
        content:
          text/xml:
            schema:
              $ref: '#/components/schemas/BatchDeleteScheduledActionType'
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - BatchDeleteScheduledAction
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - 2011-01-01
      summary: Amazon EC2 Auto Scaling POST_ Batch Delete Scheduled Action
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=BatchDeleteScheduledAction'
components:
