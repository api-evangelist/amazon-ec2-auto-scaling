security:
- hmac: []
tags:
- name: '#Action=PutNotificationConfiguration'
paths:
  /#Action=PutNotificationConfiguration:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      x-aws-operation-name: PutNotificationConfiguration
      operationId: GET_PutNotificationConfiguration
      description: <p>Configures an Auto Scaling group to send notifications when specified events take place. Subscribers to the specified topic can have messages delivered to an endpoint such as a web server or an email address.</p> <p>This configuration overwrites any existing configuration.</p> <p>For more information, see <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/ASGettingNotifications.html">Getting Amazon SNS notifications when your Auto Scaling group scales</a> in the <i>Amazon EC2 Auto Scaling User Guide</i>.</p> <p>If you exceed your maximum limit of SNS topics, which is 10 per Auto Scaling group, the call fails.</p>
      responses:
        '200':
          description: Success
        '480':
          description: LimitExceededFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/LimitExceededFault'
              examples:
                GET_PutNotificationConfiguration480Example:
                  summary: Default GET_PutNotificationConfiguration 480 response
                  x-microcks-default: true
                  value: {}
        '481':
          description: ResourceContentionFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ResourceContentionFault'
              examples:
                GET_PutNotificationConfiguration481Example:
                  summary: Default GET_PutNotificationConfiguration 481 response
                  x-microcks-default: true
                  value: {}
        '482':
          description: ServiceLinkedRoleFailure
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ServiceLinkedRoleFailure'
      parameters:
      - name: AutoScalingGroupName
        in: query
        required: true
        description: The name of the Auto Scaling group.
        schema:
          type: string
          minLength: 1
          maxLength: 255
          x-pattern: '[\u0020-\uD7FF\uE000-\uFFFD\uD800\uDC00-\uDBFF\uDFFF\r\n\t]*'
      - name: TopicARN
        in: query
        required: true
        description: The Amazon Resource Name (ARN) of the Amazon SNS topic.
        schema:
          type: string
          minLength: 1
          maxLength: 255
          x-pattern: '[\u0020-\uD7FF\uE000-\uFFFD\uD800\uDC00-\uDBFF\uDFFF\r\n\t]*'
      - name: NotificationTypes
        in: query
        required: true
        description: The type of event that causes the notification to be sent. To query the notification types supported by Amazon EC2 Auto Scaling, call the <a>DescribeAutoScalingNotificationTypes</a> API.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/XmlStringMaxLen255'
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - PutNotificationConfiguration
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - 2011-01-01
      summary: Amazon EC2 Auto Scaling GET_ Put Notification Configuration
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=PutNotificationConfiguration'
    post:
      x-aws-operation-name: PutNotificationConfiguration
      operationId: POST_PutNotificationConfiguration
      description: <p>Configures an Auto Scaling group to send notifications when specified events take place. Subscribers to the specified topic can have messages delivered to an endpoint such as a web server or an email address.</p> <p>This configuration overwrites any existing configuration.</p> <p>For more information, see <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/ASGettingNotifications.html">Getting Amazon SNS notifications when your Auto Scaling group scales</a> in the <i>Amazon EC2 Auto Scaling User Guide</i>.</p> <p>If you exceed your maximum limit of SNS topics, which is 10 per Auto Scaling group, the call fails.</p>
      responses:
        '200':
          description: Success
        '480':
          description: LimitExceededFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/LimitExceededFault'
              examples:
                POST_PutNotificationConfiguration480Example:
                  summary: Default POST_PutNotificationConfiguration 480 response
                  x-microcks-default: true
                  value: {}
        '481':
          description: ResourceContentionFault
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ResourceContentionFault'
              examples:
                POST_PutNotificationConfiguration481Example:
                  summary: Default POST_PutNotificationConfiguration 481 response
                  x-microcks-default: true
                  value: {}
        '482':
          description: ServiceLinkedRoleFailure
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ServiceLinkedRoleFailure'
      requestBody:
        content:
          text/xml:
            schema:
              $ref: '#/components/schemas/PutNotificationConfigurationType'
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
          enum:
          - PutNotificationConfiguration
      - name: Version
        in: query
        required: true
        schema:
          type: string
          enum:
          - 2011-01-01
      summary: Amazon EC2 Auto Scaling POST_ Put Notification Configuration
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#Action=PutNotificationConfiguration'
components:
